[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AnimeDlp"
version = "1.5.2"
description = "A clean and robust command-line downloader for supported anime video sites (anime1.me / anime1.pw)."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["anime", "downloader", "yt-dlp", "cli", "anime1"]

dependencies = [
    "ChronicleLogger>=1.2.3",
    "requests",
    "beautifulsoup4",
    "yt-dlp",
    "lxml"
]

[project.urls]
Homepage = "https://github.com/Wilgat/AnimeDlp"
Repository = "https://github.com/Wilgat/AnimeDlp"
Issues = "https://github.com/Wilgat/AnimeDlp/issues"

[project.scripts]
anime-dlp = "AnimeDlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
